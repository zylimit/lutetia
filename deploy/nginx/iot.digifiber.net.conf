# 并入主机已有 nginx 的一个 server block；只写 80，certbot --nginx 会自动补 443 与跳转
server {
    listen 80;
    listen [::]:80;
    server_name iot.digifiber.net;

    access_log /var/log/nginx/iot.digifiber.net.access.log;
    error_log  /var/log/nginx/iot.digifiber.net.error.log;

    # GPS51 推送接收端与健康检查 -> 容器 8080（回环）
    location ^~ /gps51/push {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 看板与查询 API -> 容器 8081 的发布端口（主机配置里设 DASHBOARD_PUBLISH_PORT=18081，8081 被占）
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
