<!doctype html>
<!--
  Embed test host (Phase 12, SC-15). For verification only: never deployed, holds no credential and no data.
  Open it from a host name under digifiber.net (web-ui/e2e/walk-embed.cjs serves it as https://test-host.digifiber.net/ with
  Playwright request interception) so the Lutetia session cookie (SameSite=Lax) counts as same-site inside the iframes.
  Query parameters: base = Lutetia base URL (default https://iot.digifiber.net), lang = en | fr (passed to the widgets),
  range = 24h | 7d | 30d (fall-timeline only).
  Every message from the widgets is printed in #log (one JSON line each) and on the console as "host-received <json>";
  lutetia:resize sets the height of the iframe that sent it.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embed test host</title>
    <style>
      body { margin: 16px; font: 14px/1.4 system-ui, sans-serif; }
      .frames { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
      iframe { width: 100%; height: 240px; border: 1px solid #999; }
      pre { min-height: 80px; padding: 8px; border: 1px solid #999; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Embed test host</h1>
    <p>Lutetia base: <code id="base"></code></p>
    <div class="frames">
      <iframe id="fall-timeline" title="Fall timeline"></iframe>
      <iframe id="manhole-map" title="Manhole map"></iframe>
      <iframe id="security-summary" title="Security summary"></iframe>
    </div>
    <h2>Messages received</h2>
    <pre id="log"></pre>
    <script>
      'use strict'
      const params = new URLSearchParams(location.search)
      const base = (params.get('base') || 'https://iot.digifiber.net').replace(/\/+$/, '')
      const lutetia = new URL(base).origin
      document.getElementById('base').textContent = base
      const query = new URLSearchParams()
      if (params.get('lang')) query.set('lang', params.get('lang'))
      if (params.get('range')) query.set('range', params.get('range'))
      const qs = query.toString() ? '?' + query.toString() : ''
      const frames = ['fall-timeline', 'manhole-map', 'security-summary']
      for (const name of frames) document.getElementById(name).src = base + '/embed/' + name + qs
      window.received = []
      window.addEventListener('message', (ev) => {
        if (ev.origin !== lutetia) return // a real host checks the sender too
        const frame = frames.map((n) => document.getElementById(n)).find((f) => f.contentWindow === ev.source)
        const line = JSON.stringify({ from: frame ? frame.id : '?', data: ev.data })
        window.received.push({ from: frame ? frame.id : '?', data: ev.data })
        document.getElementById('log').textContent += line + '\n'
        console.log('host-received ' + line)
        if (frame && ev.data && ev.data.type === 'lutetia:resize' && typeof ev.data.height === 'number') frame.style.height = ev.data.height + 'px'
      })
    </script>
  </body>
</html>
