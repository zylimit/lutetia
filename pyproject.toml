[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lutetia"
version = "0.3.0"
description = "Lutetia - IoT data collector for the Paris project (GPS51 + Dingtek)"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9", "asyncpg>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
lutetia = "lutetia.cli:main"

[tool.setuptools.packages.find]
include = ["lutetia*"]

[tool.setuptools.package-data]
lutetia = ["sql/*.sql", "web/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
