<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ariane · Orange France (demo)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1726">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ariane">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E1726'/%3E%3Cpath d='M16 5l9 20h-4l-5-12-5 12H7z' fill='%23D08A4E'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Ariane Orange France","short_name":"Ariane","display":"standalone","start_url":".","background_color":"%230E1726","theme_color":"%230E1726","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%230E1726%27/%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
<style>
:root{
  --base:#0E1726;--raised:#16223A;--line:#26344F;--text:#E8EDF5;--text2:#9AA8BF;
  --copper:#D08A4E;--ok:#3FB6A8;--warn:#E8B04A;--alert:#EF5A5A;--focus:#7FB2FF;
  --r-panel:6px;--r-tag:3px;--r-btn:6px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--base);color:var(--text);font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden}
h1,h2,h3,p,dl,dd,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
h1{font-size:20px;font-weight:600;line-height:1.25}
h2{font-size:14px;font-weight:600}
h3{font-size:13px;font-weight:600;color:var(--text2);margin:var(--s4) 0 var(--s2)}
a{color:var(--text);text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:var(--text)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-tag)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--text2)}
.cu{color:var(--copper)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.skip{position:absolute;left:8px;top:-60px;background:var(--text);color:var(--base);padding:8px 12px;border-radius:var(--r-btn);z-index:100}
.skip:focus{top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:36px;padding:0 var(--s4);border:1px solid var(--line);background:transparent;border-radius:var(--r-btn);cursor:pointer;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--text2)}
.btn.pri{background:var(--text);color:var(--base);border-color:var(--text);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-btn);overflow:hidden}
.seg button{min-height:32px;padding:0 var(--s3);background:transparent;border:0;border-right:1px solid var(--line);cursor:pointer;color:var(--text2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--text);color:var(--base);font-weight:600}
.seg button:focus-visible{outline-offset:-2px}

/* topbar */
.topbar{display:flex;align-items:center;gap:var(--s4);min-height:56px;padding:0 var(--s4);border-bottom:1px solid var(--line);background:var(--base);position:relative;flex-wrap:wrap}
.brand{font-weight:600;font-size:15px;white-space:nowrap}
.brand .sub{font-weight:400;color:var(--text2)}
.tabs{display:flex;gap:var(--s1);align-self:stretch;margin-left:var(--s4)}
.tabs a{display:flex;align-items:center;padding:0 var(--s3);color:var(--text2);text-decoration:none;border-bottom:2px solid transparent;margin-top:2px}
.tabs a:hover{color:var(--text)}
.tabs a[aria-current=page]{color:var(--text);border-bottom-color:var(--text)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:var(--s3)}
.stamp{color:var(--text2);white-space:nowrap}
.acct{min-height:36px;padding:0 var(--s3);border:1px solid var(--line);background:transparent;border-radius:var(--r-btn);cursor:pointer}
.menu{position:absolute;right:var(--s4);top:52px;z-index:30;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-panel);padding:var(--s3);min-width:240px;display:grid;gap:var(--s2)}
.menu[hidden]{display:none}

/* layout */
main{padding:var(--s4);max-width:1680px;margin:0 auto;padding-bottom:var(--s6)}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-panel);padding:var(--s4);min-width:0}
.panel>h2,.ph h2{margin-bottom:var(--s3)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
.ph h2{margin:0}
.ph a{text-decoration:none;border-bottom:1px solid var(--line)}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.stack{display:grid;gap:var(--s4)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.foot{padding:var(--s1) var(--s4) var(--s4);color:var(--text2);font-size:12px;max-width:1680px;margin:0 auto}

/* overview */
.ov{display:grid;grid-template-columns:300px minmax(0,1fr) 360px;gap:var(--s4);height:calc(100vh - 146px);min-height:640px}
.ov .col{display:flex;flex-direction:column;gap:var(--s4);min-height:0}
.ov .col>.panel{min-height:0}
.ov .p-dem{flex:none}
.ov .occp{flex:1;overflow:auto}
.ov .mhp{flex:1;overflow:auto}
.ov .gpp{flex:none}
.ov .p-map{display:flex;flex-direction:column;flex:1}
.kv{display:grid;gap:var(--s3)}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3)}
.kv dt{color:var(--text2)}
.kv dd{font-size:15px;font-weight:600;text-align:right}
.kv dd.big{font-size:30px;line-height:1.1;font-weight:600}
.kv a{text-decoration:none}
.kv a:hover{text-decoration:underline}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini th{font-weight:400;color:var(--text2);text-align:right;padding:0 0 var(--s1) var(--s2)}
.mini th:first-child,.mini td:first-child{text-align:left;padding-left:0}
.mini td{padding:var(--s1) 0 var(--s1) var(--s2);border-top:1px solid var(--line);text-align:right}
.mini a{text-decoration:none}
.hb{display:grid;grid-template-columns:104px minmax(0,1fr) 64px;gap:var(--s2);align-items:center;margin:var(--s2) 0;font-size:13px}
.hb .tr{height:14px;background:var(--base);border-radius:var(--r-tag);overflow:hidden}
.hb .fl{height:100%;background:var(--copper);border-radius:var(--r-tag)}
.hb .v{text-align:right;color:var(--copper);font-weight:600}
.hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapwrap{flex:1;min-height:260px;background:var(--base);border:1px solid var(--line);border-radius:var(--r-tag);position:relative}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.legrow{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);align-items:center;margin-top:var(--s2);font-size:12px;color:var(--text2)}
.legrow span{display:inline-flex;align-items:center;gap:6px}
.legrow .note{margin-left:auto}
.cap{min-height:20px;margin-top:var(--s2);color:var(--text2);font-size:13px}
.map-focus g[role=button],.map-focus g[role=link]{cursor:pointer}
.ring{fill:none;stroke:var(--alert);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){.ring.pulse{animation:pulse 2.6s ease-out infinite}}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.6);opacity:0}}

.wkl{display:grid;gap:2px}
.wkl a{display:grid;grid-template-columns:34px 104px minmax(0,1fr) 22px;gap:var(--s2);align-items:center;min-height:24px;text-decoration:none;border-bottom:1px solid var(--line)}
.wkl a:hover{background:var(--base)}
.wkl .w{font-weight:600}
.wkl .d{color:var(--text2);font-size:12px;white-space:nowrap}
.wkl .tk{height:6px;background:var(--base);border-radius:var(--r-tag);overflow:hidden}
.wkl .tk i{display:block;height:100%;background:var(--text2)}
.wkl b{text-align:right}
.nx{margin-bottom:var(--s1)}
.occp h3{margin-top:var(--s2)}
.nx strong{font-size:13px}
.nx ul{display:grid;gap:2px;margin-top:2px}
.nx li a{display:flex;justify-content:space-between;gap:var(--s2);font-size:13px;text-decoration:none;min-height:22px;align-items:center}
.nx li a:hover .nm2{text-decoration:underline}
.nx .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx .wk2{color:var(--text2);white-space:nowrap;font-size:12px}
.gl{display:grid;gap:0;margin-top:var(--s3)}
.gl li{display:grid;grid-template-columns:16px 62px minmax(0,1fr) 72px;gap:var(--s2);align-items:center;min-height:34px;border-top:1px solid var(--line);font-size:13px}
.gl .t2{color:var(--text2);font-size:12px}

.alertbox{border:1px solid var(--alert);border-left-width:4px;background:var(--base);border-radius:var(--r-tag);padding:var(--s3);display:flex;gap:var(--s3);align-items:flex-start}
.okline{display:flex;align-items:center;gap:var(--s2)}
.okline b{font-size:22px;font-weight:600}
.pn-alert{border-color:var(--alert)}
.evl{display:grid;gap:var(--s2);margin-top:var(--s2)}
.ev{display:grid;grid-template-columns:20px 1fr;gap:var(--s2);padding-top:var(--s2);border-top:1px solid var(--line)}
.ev:first-child{border-top:0;padding-top:0}
.ev .id{font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ev dl{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);color:var(--text2);font-size:13px}
.ev dd{color:var(--text)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:var(--r-tag);padding:0 6px;font-size:12px;color:var(--text2);white-space:nowrap}
.tag.al{border-color:var(--alert);color:var(--text)}
.tag.wn{border-color:var(--warn);color:var(--text)}

/* filters */
.fbar{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-bottom:var(--s3)}
.chip{display:inline-flex;align-items:center;gap:var(--s1);border:1px solid var(--line);border-radius:var(--r-tag);padding:0 0 0 var(--s2);min-height:28px;background:var(--raised)}
.chip button{border:0;background:transparent;cursor:pointer;min-width:28px;min-height:28px;color:var(--text2)}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s3)}
.fgrid label{display:grid;gap:var(--s1);color:var(--text2);font-size:13px}
select,input[type=text],input[type=password]{min-height:36px;background:var(--base);border:1px solid var(--line);border-radius:var(--r-btn);padding:0 var(--s2);width:100%}
.sum{display:flex;gap:var(--s5);flex-wrap:wrap;align-items:baseline;margin-bottom:var(--s4)}
.sum b{font-size:18px}

/* timeline */
.scroller{overflow-x:auto}
.tl{min-width:640px}
.tl-h,.tl-l{display:grid;grid-template-columns:96px 1fr}
.tl-wk{display:grid;grid-template-columns:repeat(6,1fr);font-size:12px;color:var(--text2);border-bottom:1px solid var(--line)}
.tl-wk span{padding:0 var(--s1) var(--s1)}
.tl-l{margin-top:var(--s2)}
.tl-l>div:first-child{font-weight:600;font-size:13px;padding-top:2px}
.tl-r{position:relative;background:linear-gradient(to right,var(--line) 1px,transparent 1px) 0 0/calc(100%/6) 100%}
.bar-poi{position:absolute;height:20px;background:var(--text2);color:var(--base);border:0;border-radius:var(--r-tag);font-size:11px;font-weight:600;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-align:left}
.bar-poi:hover{background:var(--text)}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;color:var(--text2);padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);vertical-align:middle}
.t th.num,.t td.num{text-align:right}
.t tr.sel td{background:var(--base)}
.t tr.segrow>td{background:var(--base);padding:var(--s2) var(--s4)}
.t.in td,.t.in th{padding:var(--s1) var(--s3)}
.xbtn{display:inline-flex;align-items:center;gap:var(--s2);background:none;border:0;cursor:pointer;padding:var(--s1) 0;min-height:32px;font-weight:600}
.xbtn svg{transition:none}
.xbtn[aria-expanded=true] svg{transform:rotate(90deg)}
.st{display:inline-flex;align-items:center;gap:var(--s2)}

/* SLA */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s3);counter-reset:n;margin-top:var(--s3)}
.flow li{position:relative;border:1px solid var(--line);border-radius:var(--r-tag);padding:var(--s2) var(--s3);background:var(--base);min-height:64px}
.flow li::after{content:"";position:absolute;top:50%;right:calc(-1 * var(--s3));width:var(--s3);border-top:1px solid var(--text2)}
.flow li:nth-child(5n)::after,.flow li:last-child::after{display:none}
.flow .no{color:var(--text2);font-size:12px}
.flow .nm{font-weight:600;font-size:13px}
.flow .pt{display:flex;align-items:center;gap:var(--s1);color:var(--text2);font-size:12px;margin-top:2px}
.flow li.x{border-style:dashed}
.lg{display:flex;gap:var(--s4);flex-wrap:wrap;color:var(--text2);font-size:13px;margin-top:var(--s2)}
.lg span{display:inline-flex;align-items:center;gap:var(--s1)}

/* manhole / copper */
.mh2{display:grid;grid-template-columns:360px minmax(0,1fr);gap:var(--s4);align-items:start}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.duo .mapwrap{height:400px;flex:none}
.duo-h{font-weight:600;font-size:13px;margin-bottom:var(--s1)}
.sw{display:inline-flex;align-items:center;gap:var(--s2);background:none;border:0;cursor:pointer;min-height:36px}
.sw i{width:36px;height:20px;border:1px solid var(--text2);border-radius:10px;position:relative;display:inline-block}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--text2)}
.sw[aria-checked=true] i{background:var(--ok);border-color:var(--ok)}
.sw[aria-checked=true] i::after{left:19px;background:var(--base)}

/* banners, state */
.banner{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;border:1px solid var(--warn);border-left-width:4px;background:var(--raised);border-radius:var(--r-tag);padding:var(--s2) var(--s3);margin-bottom:var(--s4)}
.banner .grow{flex:1;min-width:200px}
.empty{padding:var(--s6) var(--s4);display:grid;gap:var(--s3);justify-items:start;max-width:560px}
.empty h2{font-size:18px}
.sk{background:var(--line);border-radius:var(--r-tag);margin:var(--s2) 0}
.dlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:var(--s4)}
.dlg::before{content:"";position:absolute;inset:0;background:var(--base);opacity:.85}
.dlg .box{position:relative;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-panel);padding:var(--s5);max-width:420px;display:grid;gap:var(--s3)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:var(--s5);padding:var(--s5);max-width:1200px;margin:0 auto;align-items:center}
.lg-art h1{font-size:28px;margin-bottom:var(--s3)}
.lg-art p{color:var(--text2);max-width:420px}
.lg-art svg{width:100%;max-width:380px;height:auto;margin-top:var(--s4)}
.lg-form{display:grid;gap:var(--s4)}
.lg-form fieldset{border:0;margin:0;padding:0;display:grid;gap:var(--s3)}
.lg-form legend{font-weight:600;margin-bottom:var(--s2);padding:0}
.lg-form label.f{display:grid;gap:var(--s1);color:var(--text2);font-size:13px}
.radios{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.radios label{border:1px solid var(--line);border-radius:var(--r-btn);padding:var(--s2) var(--s3);cursor:pointer;display:grid;gap:2px;min-height:44px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios label:has(input:checked){background:var(--base);border-color:var(--text)}
.radios label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.radios small{color:var(--text2)}
.chk{display:flex;align-items:center;gap:var(--s2);min-height:36px}
.chk input{width:18px;height:18px;accent-color:var(--text2)}
.err{color:var(--text);border-left:3px solid var(--alert);padding-left:var(--s2)}

/* demo states */
.demo{position:fixed;top:60px;right:12px;z-index:50}
.demo .dp{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-panel);padding:var(--s3);width:272px;display:grid;gap:var(--s2)}
.demo .dp[hidden]{display:none}
.demo .g{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1)}
.demo .g button,.demo .rs{min-height:36px;border:1px solid var(--line);background:transparent;border-radius:var(--r-btn);cursor:pointer}
.demo .g button[aria-pressed=true]{background:var(--text);color:var(--base);font-weight:600}
.demo small{color:var(--text2);font-size:12px}
.sm{display:none}
.lg-top{position:absolute;top:12px;right:12px;z-index:5}

.tabbar{display:none}
svg text{font-family:inherit}

@media (max-width:1279px){
  .ov{grid-template-columns:260px minmax(0,1fr) 300px}
  .fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .flow{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flow li:nth-child(5n)::after{display:block}
  .flow li:nth-child(4n){}
  .flow li:nth-child(4n)::after{display:none}
}
@media (max-width:1023px){
  .ov{display:flex;flex-direction:column;height:auto;min-height:0}
  .ov .c2{order:-1}
  .ov .mapwrap{height:380px;flex:none}
  .ov .p-dem,.ov .occp{overflow:visible}
  .mh2{grid-template-columns:1fr}
  .duo{grid-template-columns:1fr}
  .duo .mapwrap{height:340px}
  .two{grid-template-columns:1fr}
  .tabs{order:3;width:100%;margin:0;overflow-x:auto}
  .topbar{padding-bottom:0}
  .flow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .flow li::after{display:block!important}
  .flow li:nth-child(3n)::after{display:none!important}
  .login{grid-template-columns:1fr;padding-top:64px}
}
@media (max-width:600px){
  body{font-size:15px}
  main{padding:var(--s3);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  .topbar{min-height:52px;padding:0 var(--s3);flex-wrap:nowrap;gap:var(--s2)}
  .tabs{display:none}
  .brand .sub{display:none}
  .stamp{font-size:13px}
  .lbl{display:none}
  .sm{display:inline}
  .btn,.acct,.seg button,.sw{min-height:44px}
  .acct,.topbar .btn.ico{min-width:44px;padding:0 var(--s3)}
  .menu{right:var(--s3);top:50px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--raised);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:12px;color:var(--text2);text-decoration:none}
  .tabbar a[aria-current=page]{color:var(--text);box-shadow:inset 0 2px 0 var(--text)}
  .tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
  .ov .mapwrap{height:320px}
  .duo{grid-template-columns:1fr}
  .duo .mapwrap{height:300px}
  .fgrid{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr;gap:var(--s2)}
  .flow li::after{display:block!important;top:100%;right:auto;left:20px;width:0;height:var(--s2);border-top:0;border-left:1px solid var(--text2)}

    var q = {}; parts[1].split("&").forEach(function (kv) { var p = kv.split("="); q[p[0]] = decodeURIComponent(p[1] || ""); });

function csv() {

  var rows = [["POI", "UCI", "Subcontractor", "Commune", "Category", "Segments", "Length (km)", "Planned (t)", "Received", "Planned op date", "OCC"]].concat(list.map(function (p) {

function refresh() { st.min = Math.min(59, st.min + 1); st.mode = "normal"; render(); }

  else if (a === "selgo") { st.sel = t.dataset.id; if (st.view !== "manhole") { st.focus.manhole = "france"; go("#/manhole"); } else { render(); } }

});
document.addEventListener("change", function (e) {

document.addEventListener("keydown", function (e) {
