  .od-touch  { min-width: 44px; min-height: 44px; }

function demolition(){const list=filtered();return `${filtersUI()}${list.length?`<div class="twocol"><section class="panel chart-panel"><div class="panel-head"><h2>Planned tonnes by subcontractor</h2></div><div class="panel-body">${bars(list,'partner')}</div></section><section class="panel chart-panel"><div class="panel-head"><h2>Planned tonnes by cable type</h2></div><div class="panel-body">${bars(list,'type')}</div></section></div>${timeline(list)}${poiTable(list)}`:empty()}${sla()}`}
function manholes(){return `<div class="sensor-summaries"><span><strong>10 / 12</strong>Online</span><span><strong class="alert">1</strong>Movement &lt;24 h</span><span><strong class="warn">1</strong>Low voltage</span></div><div class="twocol">${mapPanel('manholes','Sensor footprint',true)}<section class="panel"><div class="panel-head"><h2>Movement events</h2><span class="tag">Last 7 days</span></div><ol class="movement-list">${events.map((e,i)=>`<li><div class="movement-title"><strong>${e.imei}</strong><span class="tag ${i===0?'alert':''}">${i===0?'Moved <24 h':'Earlier event'}</span></div><p>${sensors.find(s=>s.imei===e.imei).commune} / ${e.date} ${e.time}</p><div class="event-facts"><span><strong>${e.mins} min</strong> duration</span><span><strong>${e.flips}</strong> flips</span></div></li>`).join('')}</ol><div class="panel-body small muted">All alarmFall flips within 30 minutes are merged into one movement event. Display times use the fixed France demo clock.</div></section></div><section class="panel"><div class="panel-head"><h2>Sensor register</h2><span class="small muted">12 devices / low voltage ≤3.40 V</span></div><table class="data-table"><thead><tr><th style="width:21%">IMEI / Status</th><th style="width:24%">Location</th><th>Voltage</th><th>Signal</th><th>Last report</th><th>Events / 7 days</th></tr></thead><tbody>${sensors.map(s=>`<tr>${td('IMEI / Status',`<strong class="imei">${s.imei}</strong><div style="margin-top:6px"><span class="tag ${s.moved?'alert':s.online?'ok':''}">${s.moved?'△ Moved':s.online?'● Online':'○ Offline'}</span></div>`)}${td('Location',`${s.commune}<div style="margin-top:6px"><span class="tag warn">Location unverified</span></div>`)}${td('Voltage',`${s.voltage.toFixed(2)} V${s.low?'<div class="warn small">! Low voltage</div>':''}`)}${td('Signal',s.signal===null?'Unavailable':s.signal+' dBm')}${td('Last report',s.last)}${td('Events / 7 days',String(s.events))}</tr>`).join('')}</tbody></table></section>`}
function copper(){return `<div class="sensor-summaries"><span><strong>2 / 5</strong>GPS online</span><span><strong>3</strong>Offline, last position retained</span></div><div class="twocol">${mapPanel('copper','Bundle locations',true)}<section class="panel"><div class="panel-head"><h2>GPS devices</h2><label class="switch-label"><input type="checkbox" id="track-toggle" ${state.tracks?'checked':''}>7-day track</label></div><ul class="device-list">${devices.map(d=>`<li class="device ${state.device===d.id?'selected':''}"><div class="device-top"><button data-device="${d.id}" aria-pressed="${state.device===d.id}">${d.id}</button><span class="tag ${d.online?'ok':''}">${d.online?'● Online':'○ Offline'}</span></div><p>Near ${d.commune} / ${d.id==='GT-3301'||d.id==='GT-3303'?'OUEST':'AURA'}</p><div class="device-coords"><span>${d.lat.toFixed(4)}° N, ${Math.abs(d.lon).toFixed(4)}° ${d.lon<0?'W':'E'}</span><span>Battery ${d.battery}%</span></div><p>Last position ${d.last}${!d.online?' / stale position':''}</p></li>`).join('')}</ul></section></div><section class="panel"><div class="panel-head"><h2>${state.device} / Position history</h2><span class="small muted">02–08 Nov 2026</span></div><div class="panel-body"><p class="muted small">${state.tracks?'Seven-day track is visible on the map.':'Enable the 7-day track to display the route on the map.'} All coordinates and movements are synthetic.</p><div class="week-grid" style="grid-template-columns:repeat(7,1fr);margin:16px 0 0">${[2,3,4,5,6,7,8].map((d,i)=>`<div class="week-cell"><span>${d} Nov</span><span class="${i===6?'ok':''}">${i===6?'Latest':'Recorded'}</span></div>`).join('')}</div></div></section>`}
function empty(){return `<section class="empty-state">${icon('search')}<h2>No matching records</h2><p>No synthetic records match this view. Clear filters to restore the project snapshot.</p><button data-action="clear" class="primary">Clear filters</button></section>`}
function loading(){return `<div class="skeleton" aria-busy="true" aria-label="Loading synthetic project data">${[1,2,3].map((v,i)=>`<div class="skeleton-column"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line ${i===1?'map':'big'}"></div>${[1,2,3,4].map(()=>'<div class="skeleton-line"></div>').join('')}</div>`).join('')}</div><div class="skeleton-caption" role="status">Loading project snapshot… <button data-action="normal">Finish loading</button></div>`}
function head(){const page=state.page,n=Object.values(state.filters).filter(Boolean).length;return `<div class="pagehead"><div><h1 id="page-title" tabindex="-1">${titles[page]}</h1><p>${page==='overview'?'Copper recovery operations across AURA and OUEST':page==='demolition'?'Planned quantities, site audits and work-order detail':page==='manholes'?'Movement monitoring and sensor health':'Last known bundle positions and seven-day tracks'}</p></div><div class="head-actions">${page==='demolition'?`<button class="filter-toggle" data-action="filters" aria-expanded="${state.filtersOpen}">${icon('filter')}Filters (${n})</button><button class="icon-btn" data-action="export">${icon('download')}Export CSV</button>`:'<span class="date-label">Sunday, 08 November 2026</span>'}<div class="state-control"><label for="state-select">State</label><select id="state-select" class="state-select">${[['normal','Normal'],['loading','Loading'],['empty','Empty'],['error','Error'],['offline','Offline'],['expired','Session expired']].map(([v,n])=>`<option value="${v}" ${state.mode===v?'selected':''}>${n}</option>`).join('')}</select></div></div></div>`}
function render(){if(!state.signed){showLogin();return}$('#signin').hidden=true;$('#app').hidden=false;$('#account-name').textContent=state.account;$('#avatar').textContent=state.account==='Orange'?'OR':state.account==='Huawei'?'HW':'OP';$('#role-name').textContent=state.account==='Operations'?'Admin':'Read-only';$('#refreshed').textContent='08 Nov 2026, '+state.refresh;$('#refresh').innerHTML=icon('refresh')+'<span>Refresh</span>';const nav=Object.keys(titles).map(k=>`<button class="navbtn ${state.page===k?'active':''}" data-page="${k}" ${state.page===k?'aria-current="page"':''}>${icon(k)}<span>${navNames[k]}</span></button>`).join('');$('#desktop-nav').innerHTML=nav+'<div class="nav-spacer"></div><span class="demo-tag">Synthetic data</span>';$('#bottom-nav').innerHTML=nav;let banner=state.mode==='error'?'<div class="banner error" role="alert"><span>Snapshot refresh failed. Showing last data from 08:42.</span><button data-action="retry">Retry</button></div>':state.mode==='offline'?'<div class="banner" role="status"><span>Offline · data as of 08:42</span><button data-action="normal">Reconnect demo</button></div>':'';const body=state.mode==='loading'?loading():state.mode==='empty'?empty():({overview,demolition,manholes,copper}[state.page])();$('#main').innerHTML=head()+banner+body+`<footer class="footer"><span>Synthetic data only. Nothing is saved; reload resets this demo.</span><span>Orange France / Huawei project team <button class="text-action mobile-only" data-action="signout">Sign out</button></span></footer>`;}
function showLogin(expired=false){$('#app').hidden=true;$('#signin').hidden=false;$('#signin').innerHTML=`<section class="signin-story"><div><div class="identity"><div class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="brandname">Ariane<span>Orange France</span></div></div><h1>A clear view.<br>From plan<br>to the ground.</h1></div>${mapSVG('plan',true)}<p class="signin-bottom">Copper recovery operations<br>AURA and Pays de la Loire</p></section><section class="signin-form-area"><span class="tag" style="align-self:flex-start;margin-bottom:24px">Orange France / Huawei</span><h2>${expired?'Session expired':'Ariane project board'}</h2><p>${expired?'Sign in again to return to the project snapshot.':'Your operations, in one place.'}</p><label>Demo account</label><div class="account-options">${['Orange','Huawei','Operations'].map(a=>`<button class="account-option" data-account="${a}" aria-pressed="${state.account===a}">${a}<span>${a==='Operations'?'Admin':'Read-only'}</span></button>`).join('')}</div><form id="login-form"><label for="username"><span>Username</span><input id="username" name="username" autocomplete="username" placeholder="e.g. project.manager" required></label><label for="password"><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Any demo password" required></label><p id="login-error" class="login-error" role="alert" hidden>Enter a username and any password to continue.</p><label class="checkrow"><input id="remember" type="checkbox" checked>Keep me signed in for 30 days</label><button class="primary" type="button" data-action="login">Sign in</button><p class="muted small">Demo accepts any password. No credentials are sent or stored.</p></form><div class="signin-foot">Synthetic data only. Nothing is saved; reload resets this demo. The 30-day option is illustrative and does not persist a session.${expired?'<div style="margin-top:16px"><button data-action="return-login">Return to sign in</button></div>':''}</div></section>`;}
function login(){if(!$('#username').value.trim()||!$('#password').value){$('#login-error').hidden=false;(!$('#username').value.trim()?$('#username'):$('#password')).focus();return}state.signed=true;state.mode='normal';render();$('#page-title').focus();announce('Signed in as '+state.account+'. Synthetic data only.')}
function navigate(p){state.page=p;render();window.scrollTo(0,0);$('#page-title')?.focus();}
function exportCSV(){const header=['POI','Commune','Region','UCI','Subcontractor','Category','Installation','Cable type','Planned tonnes','Planned km','Cable segments','OCC site audit'];const rows=filtered().map(p=>[p.id,p.commune,p.region,p.uci,p.partner,p.category,p.mode,p.type,(p.dt/10).toFixed(1),(p.km/10).toFixed(1),p.segments,auditText(p)]);const csv='\uFEFF'+[header,...rows].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='ariane-synthetic-demolition-plan.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('Exported '+rows.length+' synthetic POI work orders.')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.region){state.region=b.dataset.region;render();document.querySelector(`[data-region="${state.region}"]`)?.focus();return}if(b.dataset.account){const user=$('#username')?.value||'',pass=$('#password')?.value||'';state.account=b.dataset.account;const expired=state.mode==='expired';showLogin(expired);$('#username').value=user;$('#password').value=pass;document.querySelector(`[data-account="${state.account}"]`)?.focus();return}if(b.dataset.expand){const id=b.dataset.expand;state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render();document.querySelector(`[data-expand="${id}"]`)?.focus();return}if(b.dataset.sla){state.sla=b.dataset.sla;render();document.querySelector(`[data-sla="${state.sla}"]`)?.focus();return}if(b.dataset.device){state.device=b.dataset.device;state.region=devices.find(d=>d.id===state.device).lon<0?'OUEST':'AURA';render();document.querySelector(`[data-device="${state.device}"]`)?.focus();return}if(b.dataset.clearFilter){delete state.filters[b.dataset.clearFilter];render();document.querySelector('[data-action="filters"]')?.focus();return}switch(b.dataset.action){case'login':login();return;case'filters':state.filtersOpen=!state.filtersOpen;render();document.querySelector('[data-action="filters"]')?.focus();return;case'clear':state.filters={};state.mode='normal';render();$('#page-title').focus();return;case'normal':case'retry':state.mode='normal';render();$('#state-select').focus();announce('Synthetic snapshot restored.');return;case'export':exportCSV();return;case'signout':state.signed=false;showLogin();return;case'return-login':state.mode='normal';showLogin();return}if(b.id==='refresh'){state.refresh='08:42';if(state.mode!=='offline')state.mode='normal';render();$('#refresh').focus();announce('Synthetic snapshot refreshed at 08:42.');return}if(b.id==='signout'){state.signed=false;showLogin();return}}
const panel=e.target.closest('[data-open]');if(panel&&!e.target.closest('button,input,select,a'))navigate(panel.dataset.open);
});
document.addEventListener('change',e=>{if(e.target.id==='state-select'){state.mode=e.target.value;if(state.mode==='expired'){state.signed=false;showLogin(true);$('#username').focus();return}render();$('#state-select').focus();return}if(e.target.dataset.filter){const k=e.target.dataset.filter;state.filters[k]=e.target.value;render();document.querySelector(`[data-filter="${k}"]`)?.focus();return}if(e.target.id==='track-toggle'){state.tracks=e.target.checked;render();$('#track-toggle').focus()}});
document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();login()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#username,#password')){e.preventDefault();login()}if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const opts=['Transportation','Distribution','MASSIVE'];state.sla=opts[(opts.indexOf(state.sla)+(e.key==='ArrowRight'?1:2))%3];render();document.querySelector(`[data-sla="${state.sla}"]`).focus()}});
